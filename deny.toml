[advisories]
# Unmaintained notices for transitive deps of the pinned iced 0.14.0; no fix available from us.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, transitive via iced/wgpu" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, transitive via iced text stack" },
    { id = "RUSTSEC-2026-0319", reason = "anymap2 unmaintained, transitive via matrix-sdk 0.19.1; no fix without changing the pin" },
    # zip 0.6.6 comes only from webrtc-sys-build 0.3.19 (the newest, zip ^0.6),
    # used by its download_webrtc(), which extracts LiveKit's archive. Our builds
    # never run it: LK_CUSTOM_WEBRTC points at scripts/fetch-libwebrtc.sh's
    # verified copy, and CI's scripts/check-no-webrtc-download.sh fails if it ran.
    { id = "RUSTSEC-2026-0367", reason = "zip 0.6.6 SUID bits on extract; only webrtc-sys-build's download path, never run (LK_CUSTOM_WEBRTC)" },
    { id = "RUSTSEC-2026-0368", reason = "zip 0.6.6 symlink targets on extract; only webrtc-sys-build's download path, never run (LK_CUSTOM_WEBRTC)" },
    { id = "RUSTSEC-2026-0369", reason = "zip 0.6.6 permissions through symlinks; only webrtc-sys-build's download path, never run (LK_CUSTOM_WEBRTC)" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    # Weak copyleft, file-level only; used by the matrix-sdk tree (eyeball, eyeball-im, imbl,
    # as_variant, async-rx, readlock). We use them unmodified as dependencies. Approved Phase 1 Q2.
    "MPL-2.0",
]

# CDLA-Permissive-2.0 covers only the webpki-root-certs data (via reqwest ->
# rustls-platform-verifier in the matrix-sdk tree); scoped to that crate. Approved Phase 1 Q2.
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-root-certs"

# ksni (tray-icon's Linux KSNI backend) is Unlicense, a public-domain dedication compatible with
# GPL-3.0-or-later; scoped to that crate. Approved Phase 5 Q3.
[[licenses.exceptions]]
allow = ["Unlicense"]
crate = "ksni"

[licenses.private]
ignore = true
