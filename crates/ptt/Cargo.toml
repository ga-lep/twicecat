[package]
name = "twicecat-ptt"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
# X11, Windows and macOS hotkeys (the key is grabbed: other apps do not see it).
global-hotkey = "=0.8.0"
# Gamepads (Steam Input's virtual pads included).
gilrs = "=0.11.2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

# Wayland: the xdg-desktop-portal GlobalShortcuts portal (KDE, GNOME).
# X11: the mouse button through XInput 2 raw events (#34; the version
# global-hotkey already locks).
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
x11rb = { version = "=0.13.2", features = ["xinput"] }

# Windows: the mouse button through a low-level mouse hook (#34; the version
# global-hotkey already locks).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS: the mouse button through an NSEvent global monitor (#34; the
# versions global-hotkey and winit already lock).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSEvent", "block2"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
