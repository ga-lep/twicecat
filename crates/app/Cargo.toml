[package]
name = "tessera-app"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
iced = { version = "=0.14.0", features = ["image-without-codecs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
emojis = "0.9"
open = "5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
notify-rust = "=4.18.2"
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
tessera-core = { path = "../core" }

[dev-dependencies]
iced = { version = "=0.14.0", features = ["image-without-codecs", "advanced"] }
