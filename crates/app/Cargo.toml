[package]
name = "twicecat-app"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "twicecat"
path = "src/main.rs"

[dependencies]
iced = { version = "=0.14.0", features = ["image-without-codecs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
emojis = "0.9"
open = "5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
notify-rust = "=4.18.2"
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
twicecat-core = { path = "../core" }
# Push-to-talk sources; no matrix-sdk or media crates (scripts/check-app-deps.sh).
twicecat-ptt = { path = "../ptt" }

[features]
# The full build: speech enhancement on the GPU (DeepFilterNet3 on ONNX
# Runtime, loaded at run time; see docs/building.md). Off by default: the
# light build cleans voices on the CPU only.
gpu = ["twicecat-core/gpu-enhancement"]

[dev-dependencies]
# Performance indicators recorded by tests (docs/testing.md); std only.
twicecat-perf = { path = "../perf" }
iced = { version = "=0.14.0", features = ["image-without-codecs", "advanced"] }
