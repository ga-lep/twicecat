[package]
name = "tessera-core"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tessera-cli"
path = "src/bin/tessera-cli.rs"

[dependencies]
matrix-sdk = { version = "=0.19.1", features = ["bundled-sqlite", "local-server", "markdown", "qrcode"] }
matrix-sdk-ui = "=0.19.1"
# Only to name `UtdCause` (not re-exported by matrix-sdk or matrix-sdk-ui); same pin as matrix-sdk.
matrix-sdk-crypto = "=0.19.1"
keyring = "=4.2.0"
directories = "=6.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "io-std", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
rand = "0.10"
rpassword = "7"
zeroize = { version = "1.9", features = ["serde"] }
# Build with LK_CUSTOM_WEBRTC from scripts/fetch-libwebrtc.sh (pinned SHA-256);
# without it webrtc-sys downloads libwebrtc unverified.
tessera-audio = { path = "../audio" }
livekit = { version = "=0.9.3", default-features = false, features = ["native", "rustls-tls-native-roots"] }

[dev-dependencies]
tempfile = "3"
