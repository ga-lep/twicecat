[package]
name = "tessera-core"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tessera-cli"
path = "src/bin/tessera-cli.rs"

[dependencies]
matrix-sdk = { version = "=0.19.1", features = ["bundled-sqlite", "local-server"] }
matrix-sdk-ui = "=0.19.1"
keyring = "=4.2.0"
directories = "=6.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
rand = "0.10"
rpassword = "7"
zeroize = { version = "1.9", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
