# Dev-only LiveKit SFU for the local MatrixRTC stack (docker-compose.yml).
# Runs in the synapse container's network namespace; the compose file
# publishes its ports on 127.0.0.1 only. Keys come from .env.test.
port: 7880
rtc:
  tcp_port: 7881
  # One UDP port (ICE mux) so docker only has to publish a single port.
  udp_port: 7882
  # Clients connect from the host through the published 127.0.0.1 ports.
  use_external_ip: false
  node_ip: 127.0.0.1
room:
  # lk-jwt-service decides who may create rooms (its README requires this).
  auto_create: false
webhook:
  # Lets lk-jwt-service see participants leave (delegated delayed leave).
  api_key: devkey
  urls:
    - http://127.0.0.1:8080/sfu_webhook
logging:
  level: info
