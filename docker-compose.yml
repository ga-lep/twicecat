services:
  synapse:
    image: matrixdotorg/synapse:v1.151.0
    entrypoint: ["/bin/sh", "/start-dev.sh"]
    environment:
      SYNAPSE_SERVER_NAME: localhost
      SYNAPSE_REPORT_STATS: "no"
    # livekit and lk-jwt share this network namespace, so their ports are
    # published here, on 127.0.0.1 only.
    ports:
      - "127.0.0.1:8008:8008" # Synapse client API
      - "127.0.0.1:8080:8080" # lk-jwt-service
      - "127.0.0.1:7880:7880" # LiveKit signalling (ws)
      - "127.0.0.1:7881:7881" # LiveKit ICE over TCP
      - "127.0.0.1:7882:7882/udp" # LiveKit ICE over UDP (muxed)
    volumes:
      - synapse-data:/data
      - ./dev/synapse/start.sh:/start-dev.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # LiveKit SFU. In synapse's network namespace so that 127.0.0.1:7880 is the
  # same address for the host (published above) and for lk-jwt-service.
  livekit:
    image: livekit/livekit-server:v1.13.7
    network_mode: "service:synapse"
    depends_on:
      synapse:
        condition: service_healthy
    env_file: .env.test
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'LIVEKIT_KEYS="$$LIVEKIT_KEY: $$LIVEKIT_SECRET" exec /livekit-server --config /etc/livekit.yaml'
    volumes:
      - ./dev/livekit/livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880 >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  # MatrixRTC authorization service (standalone mode, MSC4195): checks a
  # Matrix OpenID token and hands out LiveKit JWTs. In synapse's network
  # namespace so that "localhost:8448" (the federation address it derives from
  # the server name "localhost") is Synapse's dev-only TLS listener.
  lk-jwt:
    image: ghcr.io/element-hq/lk-jwt-service:0.7.0
    network_mode: "service:synapse"
    depends_on:
      livekit:
        condition: service_healthy
    env_file: .env.test
    environment:
      LIVEKIT_JWT_BIND: ":8080"
      LIVEKIT_FULL_ACCESS_HOMESERVERS: localhost
      # Dev only: Synapse's federation listener uses a self-signed certificate.
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: YES_I_KNOW_WHAT_I_AM_DOING
    healthcheck:
      test: ["CMD", "/lk-jwt-service-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  # Element Web for the human checks, as the other side of a chat. Browsers
  # block app.element.io from calling http://localhost, so it runs locally.
  # Not started by default (CI does not need it): `docker compose --profile element up -d`,
  # then open http://localhost:8081.
  element:
    image: vectorim/element-web:v1.12.30
    profiles: ["element"]
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./dev/element/config.json:/app/config.json:ro
    depends_on:
      - synapse

volumes:
  synapse-data:
