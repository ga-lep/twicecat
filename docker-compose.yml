# Start it with scripts/stack.sh (up -d --wait, down -v, ...), which sets
# the address and ports below from the environment, .env.local or .env.test;
# a bare `docker compose` stops at the first one missing.
# The project name is fixed here, not taken from the folder's name, so the
# containers (twicecat-synapse-1, ...) and the volume (twicecat_synapse-data)
# keep their names wherever the repository is cloned.
name: twicecat

x-stack: &stack
  TWICECAT_ADDRESS: ${TWICECAT_ADDRESS:?run through scripts/stack.sh}

services:
  synapse:
    image: matrixdotorg/synapse:v1.151.0
    entrypoint: ["/bin/sh", "/start-dev.sh"]
    environment:
      SYNAPSE_SERVER_NAME: localhost
      SYNAPSE_REPORT_STATS: "no"
      # The call service as clients reach it (MSC4143 transports).
      TWICECAT_LK_JWT_URL: ${LK_JWT_URL:?run through scripts/stack.sh}
    # livekit and lk-jwt share this network namespace, so their ports are
    # published here, on TWICECAT_ADDRESS only (127.0.0.1 by default).
    # Synapse and lk-jwt-service listen on fixed ports inside, published on
    # the configured ones. LiveKit listens on the configured ports inside
    # too: lk-jwt-service uses the URL it gives clients itself, and ICE
    # candidates carry the ports.
    ports:
      - "${TWICECAT_PUBLISH_ADDRESS:?run through scripts/stack.sh}:${TWICECAT_SYNAPSE_PORT:?}:8008" # Synapse client API
      - "${TWICECAT_PUBLISH_ADDRESS}:${TWICECAT_LK_JWT_PORT:?}:8080" # lk-jwt-service
      - "${TWICECAT_PUBLISH_ADDRESS}:${TWICECAT_LIVEKIT_PORT:?}:${TWICECAT_LIVEKIT_PORT}" # LiveKit signalling (ws)
      - "${TWICECAT_PUBLISH_ADDRESS}:${TWICECAT_LIVEKIT_TCP_PORT:?}:${TWICECAT_LIVEKIT_TCP_PORT}" # LiveKit ICE over TCP
      - "${TWICECAT_PUBLISH_ADDRESS}:${TWICECAT_LIVEKIT_UDP_PORT:?}:${TWICECAT_LIVEKIT_UDP_PORT}/udp" # LiveKit ICE over UDP (muxed)
      # Second SFU and lk-jwt-service (multi-SFU tests: another "homeserver's" call service).
      - "${TWICECAT_PUBLISH_ADDRESS}:${TWICECAT_LK_JWT_PORT_B:?}:8081" # lk-jwt-service B
      - "${TWICECAT_PUBLISH_ADDRESS}:${TWICECAT_LIVEKIT_PORT_B:?}:${TWICECAT_LIVEKIT_PORT_B}" # LiveKit B signalling (ws)
      - "${TWICECAT_PUBLISH_ADDRESS}:${TWICECAT_LIVEKIT_TCP_PORT_B:?}:${TWICECAT_LIVEKIT_TCP_PORT_B}" # LiveKit B ICE over TCP
      - "${TWICECAT_PUBLISH_ADDRESS}:${TWICECAT_LIVEKIT_UDP_PORT_B:?}:${TWICECAT_LIVEKIT_UDP_PORT_B}/udp" # LiveKit B ICE over UDP (muxed)
    volumes:
      - synapse-data:/data
      - ./dev/synapse/start.sh:/start-dev.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # LiveKit SFU. In synapse's network namespace so that its address is the
  # same for the host (published above) and for lk-jwt-service.
  # dev/livekit/livekit.yaml is a template; the entrypoint fills it in.
  livekit:
    image: livekit/livekit-server:v1.13.7
    network_mode: "service:synapse"
    depends_on:
      synapse:
        condition: service_healthy
    env_file: .env.test
    environment:
      <<: *stack
      TWICECAT_LIVEKIT_PORT: ${TWICECAT_LIVEKIT_PORT:?}
      TWICECAT_LIVEKIT_TCP_PORT: ${TWICECAT_LIVEKIT_TCP_PORT:?}
      TWICECAT_LIVEKIT_UDP_PORT: ${TWICECAT_LIVEKIT_UDP_PORT:?}
      TWICECAT_WEBHOOK_PORT: "8080"
    entrypoint: ["/bin/sh", "-c"]
    command: &livekit-command
      - >-
        sed -e "s|@PORT@|$$TWICECAT_LIVEKIT_PORT|" -e "s|@TCP_PORT@|$$TWICECAT_LIVEKIT_TCP_PORT|"
        -e "s|@UDP_PORT@|$$TWICECAT_LIVEKIT_UDP_PORT|" -e "s|@NODE_IP@|$$TWICECAT_ADDRESS|"
        -e "s|@WEBHOOK_PORT@|$$TWICECAT_WEBHOOK_PORT|" /etc/livekit.yaml.in >/tmp/livekit.yaml &&
        LIVEKIT_KEYS="$$LIVEKIT_KEY: $$LIVEKIT_SECRET" exec /livekit-server --config /tmp/livekit.yaml
    volumes:
      - ./dev/livekit/livekit.yaml:/etc/livekit.yaml.in:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$TWICECAT_LIVEKIT_PORT >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  # MatrixRTC authorization service (standalone mode, MSC4195): checks a
  # Matrix OpenID token and hands out LiveKit JWTs. In synapse's network
  # namespace so that "localhost:8448" (the federation address it derives from
  # the server name "localhost") is Synapse's dev-only TLS listener.
  lk-jwt:
    image: ghcr.io/element-hq/lk-jwt-service:0.7.0
    network_mode: "service:synapse"
    depends_on:
      livekit:
        condition: service_healthy
    env_file: .env.test
    environment:
      LIVEKIT_JWT_BIND: ":8080"
      LIVEKIT_URL: ${LIVEKIT_URL:?run through scripts/stack.sh}
      LIVEKIT_FULL_ACCESS_HOMESERVERS: localhost
      # Dev only: Synapse's federation listener uses a self-signed certificate.
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: YES_I_KNOW_WHAT_I_AM_DOING
    healthcheck:
      test: ["CMD", "/lk-jwt-service-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  # A second SFU and authorization service, standing in for another
  # homeserver's call service: in Element Call's multi-SFU mode each member
  # publishes to their own, and the others subscribe there. Same dev key as
  # the first pair (test-only), different ports.
  livekit-b:
    image: livekit/livekit-server:v1.13.7
    network_mode: "service:synapse"
    depends_on:
      synapse:
        condition: service_healthy
    env_file: .env.test
    environment:
      <<: *stack
      TWICECAT_LIVEKIT_PORT: ${TWICECAT_LIVEKIT_PORT_B:?}
      TWICECAT_LIVEKIT_TCP_PORT: ${TWICECAT_LIVEKIT_TCP_PORT_B:?}
      TWICECAT_LIVEKIT_UDP_PORT: ${TWICECAT_LIVEKIT_UDP_PORT_B:?}
      TWICECAT_WEBHOOK_PORT: "8081"
    entrypoint: ["/bin/sh", "-c"]
    command: *livekit-command
    volumes:
      - ./dev/livekit/livekit.yaml:/etc/livekit.yaml.in:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$TWICECAT_LIVEKIT_PORT >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  lk-jwt-b:
    image: ghcr.io/element-hq/lk-jwt-service:0.7.0
    network_mode: "service:synapse"
    depends_on:
      livekit-b:
        condition: service_healthy
    env_file: .env.test
    environment:
      LIVEKIT_JWT_BIND: ":8081"
      LIVEKIT_URL: ${LIVEKIT_URL_B:?run through scripts/stack.sh}
      LIVEKIT_FULL_ACCESS_HOMESERVERS: localhost
      # Dev only: Synapse's federation listener uses a self-signed certificate.
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: YES_I_KNOW_WHAT_I_AM_DOING
    healthcheck:
      test: ["CMD", "/lk-jwt-service-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  # Element Web for the human checks, as the other side of a chat. Browsers
  # block app.element.io from calling http://localhost, so it runs locally.
  # Not started by default (CI does not need it): `docker compose --profile element up -d`,
  # then open http://localhost:8082.
  element:
    image: vectorim/element-web:v1.12.30
    profiles: ["element"]
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./dev/element/config.json:/app/config.json:ro
    depends_on:
      - synapse

volumes:
  synapse-data:
