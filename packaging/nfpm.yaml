# nfpm (scripts/package.sh): the .deb and the .rpm, from the staged /usr tree
# scripts/package.sh builds (binary, resources, desktop files, icons,
# notices). One description for both, so their contents never drift; only
# the dependency names differ (overrides). Phase 7 plan Q13.
#
# scripts/package.sh sets TWICECAT_VERSION, TWICECAT_ARCH (amd64 or arm64)
# and TWICECAT_STAGE (the staged tree's root, holding usr/).
name: twicecat
version: ${TWICECAT_VERSION}
arch: ${TWICECAT_ARCH}
platform: linux
release: "1"
section: net
priority: optional
maintainer: The Twicecat developers <https://github.com/ga-lep/twicecat/issues>
vendor: Twicecat
homepage: https://github.com/ga-lep/twicecat
license: GPL-3.0-or-later
description: |-
  Encrypted chat and voice calls on Matrix
  Twicecat is a native desktop Matrix client written in Rust: end-to-end
  encrypted rooms and direct messages, voice calls compatible with Element
  Call, and push-to-talk on a global key or a gamepad button.

contents:
  - src: ${TWICECAT_STAGE}/usr
    dst: /usr
    type: tree
    expand: true

# The libraries the binary links (ldd; scripts/package.sh fails if that list
# changes), then, as recommendations, the ones it loads at run time: Wayland,
# xkbcommon, Vulkan (wgpu), and X11 for X sessions. Built on Ubuntu 24.04
# (dev/ubuntu-24.04, glibc 2.39; plan Q14): runs on Ubuntu 24.04, Debian 13,
# Fedora 43 or newer, and SteamOS on the Steam Frame. scripts/package.sh
# fails if the binary needs a newer glibc than these lines say.
overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libgcc-s1
      - libpipewire-0.3-0t64
      - libasound2t64
      - libudev1
    recommends:
      - libwayland-client0
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-xcb1
      - libvulkan1
  rpm:
    depends:
      - glibc >= 2.39
      - libgcc
      - pipewire-libs
      - alsa-lib
      - systemd-libs
    recommends:
      - libwayland-client
      - libxkbcommon
      - libxkbcommon-x11
      - vulkan-loader

rpm:
  summary: Encrypted chat and voice calls on Matrix
  group: Applications/Internet
  compression: zstd
deb:
  compression: zstd
